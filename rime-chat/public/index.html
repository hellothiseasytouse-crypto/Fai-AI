<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a0d12"><title>Rime</title><link rel="icon" href="/avatar.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app"><aside class="sidebar"><div class="profile"><img class="avatar large" src="/avatar.svg" alt=""><h1 id="botName">Rime</h1><p id="botTagline" class="muted"></p></div><p id="botDescription" class="description"></p><p class="notice"><b>AI</b> Fictional character. Not a real person.</p></aside>
<main class="chat"><header class="topbar"><img class="avatar" src="/avatar.svg" alt=""><div class="toptext"><strong id="topName">Rime</strong><small id="status">online</small></div><button id="clearBtn" type="button">Clear</button></header><div id="demoBanner" class="banner" hidden>Demo mode: canned replies. Configure a model in <code>.env</code>.</div><section id="messages" class="messages" role="log" aria-live="polite"></section><form id="composer" class="composer"><textarea id="input" maxlength="1000" rows="1" placeholder="message" aria-label="Message"></textarea><button id="sendBtn" type="submit" disabled aria-label="Send">↑</button></form></main></div><script src="/app.js"></script></body></html>
